<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Universal Remote (Cloud Portal)</title>
  <!-- MQTT.js for browser WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #171d2b 0%, #0a0d14 100%);
      --card-bg: rgba(22, 27, 39, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0284c7;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.12);
      --status-on: #10b981;
      --status-off: #475569;
      --status-warn: #f59e0b;
      --status-err: #ef4444;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-color: #0a0d14;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
    }

    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 8px 4px;
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .title-group p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cloud-badge.online {
      color: var(--status-on);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .cloud-badge.connecting {
      color: var(--status-warn);
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.1);
    }

    .cloud-badge.offline {
      color: var(--status-err);
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .cloud-badge.online .pulse-dot {
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-blue);
    }

    main {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 14px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-badge.on {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.off {
      background: rgba(255, 255, 255, 0.04);
      color: #64748b;
      border-color: rgba(255, 255, 255, 0.06);
    }

    .btn-grid {
      display: grid;
      gap: 8px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    button {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      padding: 12px 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.12s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }

    .btn-subtext {
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .btn-master-on {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.25) 100%);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .btn-master-off {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(185, 28, 28, 0.2) 100%);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .btn-toggle {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    /* Subtle Sync Controls */
    .resync-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .resync-label {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .btn-pill {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Modal Backdrop and Box */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: #151b28;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-save {
      flex: 2;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      color: #ffffff;
      padding: 10px;
      font-size: 0.88rem;
    }

    .btn-cancel {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      padding: 10px;
      font-size: 0.88rem;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      pointer-events: none;
      z-index: 200;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Universal Remote</h1>
      <p>Worldwide Cloud Portal (MQTT over WSS)</p>
    </div>
    <div class="header-actions">
      <div class="cloud-badge offline" id="cloudBadge" onclick="openSettings()">
        <span class="pulse-dot"></span>
        <span id="cloudStatusText">Offline</span>
      </div>
      <button class="btn-settings" onclick="openSettings()" title="Settings">⚙️</button>
    </div>
  </header>

  <main>
    <!-- Master Macros -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>✨</span> Master Macros</div>
        <span class="status-badge" id="hubState">Ready</span>
      </div>
      <div class="btn-grid grid-2">
        <button class="btn-master-on" onclick="sendCmd('all_on', 'ALL ON')">
          <span>⚡ ALL ON</span>
          <span class="btn-subtext">Smart Turn On</span>
        </button>
        <button class="btn-master-off" onclick="sendCmd('all_off', 'ALL OFF')">
          <span>🌙 ALL OFF</span>
          <span class="btn-subtext">Smart Turn Off</span>
        </button>
      </div>
    </div>

    <!-- Poster Light -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>🖼️</span> Poster Light (IR NEC)</div>
        <span class="status-badge" id="posterBadge">OFF</span>
      </div>
      <div class="btn-grid grid-3">
        <button onclick="sendCmd('poster_on', 'Poster ON')">
          <span>Turn ON</span>
          <span class="btn-subtext">NEC 0x03</span>
        </button>
        <button onclick="sendCmd('poster_off', 'Poster OFF')">
          <span>Turn OFF</span>
          <span class="btn-subtext">NEC 0x98</span>
        </button>
        <button onclick="sendCmd('poster_color', 'Poster Color')">
          <span>Color</span>
          <span class="btn-subtext">NEC 0x50</span>
        </button>
      </div>
    </div>

    <!-- Donut Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>🍩</span> Donut Lamp (IR NEC)</div>
        <span class="status-badge" id="donutBadge">OFF</span>
      </div>
      <div class="btn-grid grid-2">
        <button onclick="sendCmd('donut_on', 'Donut ON')">
          <span>Turn ON</span>
          <span class="btn-subtext">NEC 0x40</span>
        </button>
        <button onclick="sendCmd('donut_off', 'Donut OFF')">
          <span>Turn OFF</span>
          <span class="btn-subtext">NEC 0x41</span>
        </button>
      </div>
    </div>

    <!-- Bedside Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>🛏️</span> Bedside Lamp (IR Pulse)</div>
        <span class="status-badge" id="bedsideBadge">OFF</span>
      </div>
      <div class="btn-grid grid-2" style="margin-bottom: 8px;">
        <button class="btn-toggle" style="grid-column: span 2;" onclick="sendCmd('bedside_power', 'Bedside Power')">
          <span>Power Toggle</span>
          <span class="btn-subtext">Pulse 0x1F2</span>
        </button>
      </div>
      <div class="btn-grid grid-4">
        <button onclick="sendCmd('bedside_brighter', 'Bedside Brighter')">
          <span>Brighter</span>
          <span class="btn-subtext">▲ 0x3B2</span>
        </button>
        <button onclick="sendCmd('bedside_dimmer', 'Bedside Dimmer')">
          <span>Dimmer</span>
          <span class="btn-subtext">▼ Raw Array</span>
        </button>
        <button onclick="sendCmd('bedside_warmer', 'Bedside Warmer')">
          <span>Warmer</span>
          <span class="btn-subtext">☀️ Amber</span>
        </button>
        <button onclick="sendCmd('bedside_cooler', 'Bedside Cooler')">
          <span>Cooler</span>
          <span class="btn-subtext">❄️ White</span>
        </button>
      </div>
      <div class="resync-bar">
        <span class="resync-label">State Sync:</span>
        <button class="btn-pill" onclick="resync('bedside', 1)">Sync ON</button>
        <button class="btn-pill" onclick="resync('bedside', 0)">Sync OFF</button>
      </div>
    </div>

    <!-- Floor Lamp (3.3V RF) -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>💡</span> Floor Lamp (3.3V RF)</div>
        <span class="status-badge" id="floorBadge">OFF</span>
      </div>
      <div class="btn-grid grid-2" style="margin-bottom: 8px;">
        <button class="btn-toggle" style="grid-column: span 2;" onclick="sendCmd('floor_power', 'Floor Power')">
          <span>Power Toggle</span>
          <span class="btn-subtext">LM3046 Transistor Switch</span>
        </button>
      </div>
      <div class="btn-grid grid-4">
        <button onclick="sendCmd('floor_brighter', 'Floor Brighter')">
          <span>Brighter</span>
          <span class="btn-subtext">▲ Bright</span>
        </button>
        <button onclick="sendCmd('floor_dimmer', 'Floor Dimmer')">
          <span>Dimmer</span>
          <span class="btn-subtext">▼ Bright</span>
        </button>
        <button onclick="sendCmd('floor_warmer', 'Floor Warmer')">
          <span>Warmer</span>
          <span class="btn-subtext">☀️ Amber</span>
        </button>
        <button onclick="sendCmd('floor_cooler', 'Floor Cooler')">
          <span>Cooler</span>
          <span class="btn-subtext">❄️ White</span>
        </button>
      </div>
      <div class="resync-bar">
        <span class="resync-label">State Sync:</span>
        <button class="btn-pill" onclick="resync('floor', 1)">Sync ON</button>
        <button class="btn-pill" onclick="resync('floor', 0)">Sync OFF</button>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">
        <span>⚙️ HiveMQ Cloud Settings</span>
        <span style="cursor:pointer; font-size:1.2rem;" onclick="closeSettings()">&times;</span>
      </div>
      <div class="form-group">
        <label>Cluster Host</label>
        <input type="text" id="cfgHost" placeholder="e.g. xxxxxx.s1.eu.hivemq.cloud" />
      </div>
      <div class="form-group">
        <label>WebSockets Port (HiveMQ WSS is 8884)</label>
        <input type="number" id="cfgPort" value="8884" />
      </div>
      <div class="form-group">
        <label>Path</label>
        <input type="text" id="cfgPath" value="/mqtt" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="cfgUser" placeholder="HiveMQ credentials username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="cfgPass" placeholder="HiveMQ credentials password" />
      </div>
      <div class="form-group">
        <label>Topic Prefix</label>
        <input type="text" id="cfgPrefix" value="home/universal_remote" />
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let client = null;
    let toastTimer = null;

    const defaultCfg = {
      host: '0a91464cd01b488489e6e5603cba4112.s1.eu.hivemq.cloud',
      port: 8884,
      path: '/mqtt',
      user: 'anmolp',
      pass: 'aplights',
      prefix: 'home/universal_remote'
    };

    function loadConfig() {
      const stored = localStorage.getItem('remote_mqtt_cfg');
      if (stored) {
        try { return Object.assign({}, defaultCfg, JSON.parse(stored)); } catch(e){}
      }
      return Object.assign({}, defaultCfg);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    function haptic() {
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(20);
    }

    function updateBadge(id, isOn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = isOn ? 'ON' : 'OFF';
      el.className = 'status-badge ' + (isOn ? 'on' : 'off');
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('cloudBadge');
      const label = document.getElementById('cloudStatusText');
      badge.className = 'cloud-badge ' + status;
      label.textContent = text;
    }

    function openSettings() {
      const cfg = loadConfig();
      document.getElementById('cfgHost').value = cfg.host;
      document.getElementById('cfgPort').value = cfg.port;
      document.getElementById('cfgPath').value = cfg.path;
      document.getElementById('cfgUser').value = cfg.user;
      document.getElementById('cfgPass').value = cfg.pass;
      document.getElementById('cfgPrefix').value = cfg.prefix;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const cfg = {
        host: document.getElementById('cfgHost').value.trim(),
        port: parseInt(document.getElementById('cfgPort').value) || 8884,
        path: document.getElementById('cfgPath').value.trim() || '/mqtt',
        user: document.getElementById('cfgUser').value.trim(),
        pass: document.getElementById('cfgPass').value.trim(),
        prefix: document.getElementById('cfgPrefix').value.trim() || 'home/universal_remote'
      };
      localStorage.setItem('remote_mqtt_cfg', JSON.stringify(cfg));
      closeSettings();
      connectMqtt();
    }

    function connectMqtt() {
      const cfg = loadConfig();
      if (!cfg.host) {
        setConnectionStatus('offline', 'Setup Required');
        openSettings();
        return;
      }

      if (client) {
        try { client.end(true); } catch(e){}
        client = null;
      }

      setConnectionStatus('connecting', 'Connecting...');

      const protocol = 'wss';
      const cleanPath = cfg.path.startsWith('/') ? cfg.path : '/' + cfg.path;
      const brokerUrl = `${protocol}://${cfg.host}:${cfg.port}${cleanPath}`;
      const clientId = 'web-portal-' + Math.random().toString(16).substring(2, 8);

      const opts = {
        clientId: clientId,
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 5000,
        username: cfg.user || undefined,
        password: cfg.pass || undefined
      };

      console.log('Connecting to', brokerUrl);

      try {
        client = mqtt.connect(brokerUrl, opts);

        client.on('connect', () => {
          console.log('[MQTT] Connected to cloud broker');
          setConnectionStatus('online', 'Cloud Live');
          showToast('Connected to HiveMQ Cloud');

          const statusTopic = `${cfg.prefix}/status`;
          const availTopic = `${cfg.prefix}/availability`;

          client.subscribe([statusTopic, availTopic], (err) => {
            if (!err) console.log('Subscribed to status topics');
          });
        });

        client.on('message', (topic, payload) => {
          const str = payload.toString();
          console.log('[MQTT RX]', topic, str);

          if (topic.endsWith('/status')) {
            try {
              const data = JSON.parse(str);
              updateBadge('posterBadge', data.poster);
              updateBadge('donutBadge', data.donut);
              updateBadge('bedsideBadge', data.bedside);
              const floorVal = data.floor !== undefined ? data.floor : data.overhead;
              updateBadge('floorBadge', floorVal);
              updateBadge('overheadBadge', floorVal);

              const hubState = document.getElementById('hubState');
              if (hubState) {
                hubState.textContent = data.busy ? 'Busy...' : 'Ready';
                hubState.className = 'status-badge ' + (data.busy ? 'on' : '');
              }
            } catch(e){}
          } else if (topic.endsWith('/availability')) {
            if (str === 'offline') {
              showToast('ESP8266 Hub is currently offline');
            }
          }
        });

        client.on('error', (err) => {
          console.error('[MQTT Error]', err);
          setConnectionStatus('offline', 'Error');
        });

        client.on('close', () => {
          setConnectionStatus('offline', 'Disconnected');
        });

        client.on('reconnect', () => {
          setConnectionStatus('connecting', 'Reconnecting...');
        });

      } catch (err) {
        console.error('Failed to init MQTT:', err);
        setConnectionStatus('offline', 'Failed');
      }
    }

    function sendCmd(action, label) {
      haptic();
      showToast(label || action);

      const cfg = loadConfig();
      if (!client || !client.connected) {
        showToast('Not connected to cloud');
        return;
      }

      const cmdTopic = `${cfg.prefix}/command`;
      client.publish(cmdTopic, action, { qos: 0 });
    }

    function resync(device, state) {
      haptic();
      const stateStr = state ? 'on' : 'off';
      showToast(`Resync ${device} -> ${stateStr.toUpperCase()}`);
      sendCmd(`sync_${device}_${stateStr}`, `Sync ${device} ${stateStr.toUpperCase()}`);
    }

    // Check for ?action= URL parameter for Apple Shortcuts / Siri triggers
    function checkUrlAction() {
      const params = new URLSearchParams(window.location.search);
      const action = params.get('action');
      if (action) {
        console.log('[Auto Action] Triggering from URL parameter:', action);
        showToast(`Auto Action: ${action}`);
        // Dispatch once connected (or wait briefly if connecting)
        const tryDispatch = () => {
          if (client && client.connected) {
            sendCmd(action, `Siri/Shortcut: ${action}`);
            // Clean URL query param so refreshing doesn't re-trigger
            window.history.replaceState({}, document.title, window.location.pathname);
          } else {
            setTimeout(tryDispatch, 200);
          }
        };
        tryDispatch();
      }
    }

    // Auto-connect on page load
    window.addEventListener('DOMContentLoaded', () => {
      connectMqtt();
      checkUrlAction();
    });
  </script>
</body>
</html>
