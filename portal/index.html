<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Universal Remote</title>
  <!-- MQTT.js for browser WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #171d2b 0%, #0a0d14 100%);
      --card-bg: rgba(22, 27, 39, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.28);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.12);
      --status-on: #10b981;
      --status-off: #475569;
      --status-warn: #f59e0b;
      --status-err: #ef4444;
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-color: #0a0d14;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
    }

    header {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 6px 4px;
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .title-group p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cloud-badge.online {
      color: var(--status-on);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .cloud-badge.connecting {
      color: var(--status-warn);
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.1);
    }

    .cloud-badge.offline {
      color: var(--status-err);
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .cloud-badge.online .pulse-dot {
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-blue);
    }

    /* 2x3 Grid Container */
    main {
      width: 100%;
      max-width: 580px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-items: start;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 195px;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-badge.on {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.off {
      background: rgba(255, 255, 255, 0.04);
      color: #64748b;
      border-color: rgba(255, 255, 255, 0.06);
    }

    .btn-expand {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-expand:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-blue);
    }

    .btn-expand svg {
      transition: transform 0.25s ease;
    }

    .btn-expand.expanded svg {
      transform: rotate(180deg);
      stroke: var(--accent-blue);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }

    .btn-grid {
      display: grid;
      gap: 8px;
      flex: 1;
      height: 100%;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
      height: 100%;
    }
    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Buttons */
    button {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      padding: 12px 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }

    .grid-2 > button {
      height: 100%;
      min-height: 116px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .btn-on {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .btn-off {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-master-on {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.25) 100%);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .btn-master-off {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(185, 28, 28, 0.2) 100%);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* Split layout for Bedside & Floor (Power on left, Quad on right) */
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      flex: 1;
      height: 100%;
    }

    .btn-power-tall {
      height: 100%;
      min-height: 116px;
      font-size: 1rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      border-radius: 12px;
    }

    .quad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      height: 100%;
      min-height: 116px;
    }

    .btn-quad {
      padding: 0;
      height: 100%;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 10px;
    }

    /* Inline Drawer Accordion */
    .drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.open {
      grid-template-rows: 1fr;
    }

    .drawer-inner {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer.open .drawer-inner {
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 8px;
    }

    .btn-wide {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 10px;
    }

    .grid-4 button {
      min-height: 44px;
      padding: 10px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 8px;
    }

    .resync-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 4px;
    }

    .resync-label {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .btn-pill {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    /* Modal Backdrop & Card */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b27;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 22px;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .btn-save {
      background: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      color: #041019;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(22, 27, 39, 0.95);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      pointer-events: none;
      z-index: 200;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Universal Remote</h1>
      <p>Smart Lighting Hub</p>
    </div>
    <div class="header-actions">
      <div class="cloud-badge offline" id="cloudBadge" onclick="openSettings()">
        <span class="pulse-dot"></span>
        <span id="cloudStatusText">Offline</span>
      </div>
      <button class="btn-settings" onclick="openSettings()" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Card 1: All Lights -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">All Lights</div>
        <div class="header-right">
          <span class="status-badge" id="hubState">Ready</span>
        </div>
      </div>
      <div class="card-body">
        <div class="btn-grid grid-2">
          <button class="btn-master-on" onclick="sendCmd('all_on', 'ALL ON')">ALL ON</button>
          <button class="btn-master-off" onclick="sendCmd('all_off', 'ALL OFF')">ALL OFF</button>
        </div>
      </div>
    </div>

    <!-- Card 2: Poster Light -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Poster</div>
        <div class="header-right">
          <span class="status-badge" id="posterBadge">OFF</span>
          <button class="btn-expand" onclick="toggleDrawer('posterDrawer', this)" aria-label="Expand">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="btn-grid grid-2">
          <button class="btn-on" onclick="sendCmd('poster_on', 'Poster ON')">ON</button>
          <button class="btn-off" onclick="sendCmd('poster_off', 'Poster OFF')">OFF</button>
        </div>
      </div>
      <div class="drawer" id="posterDrawer">
        <div class="drawer-inner">
          <button class="btn-wide" onclick="sendCmd('poster_color', 'Poster Color')">Color Cycle</button>
        </div>
      </div>
    </div>

    <!-- Card 3: Floor Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Floor</div>
        <div class="header-right">
          <span class="status-badge" id="floorBadge">OFF</span>
          <button class="btn-expand" onclick="toggleDrawer('floorDrawer', this)" aria-label="Expand">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="split-layout">
          <button class="btn-power-tall" onclick="sendCmd('floor_power', 'Floor Power')">Power</button>
          <div class="quad-grid">
            <button class="btn-quad" onclick="sendCmd('floor_brighter', 'Floor Brighter')" title="Brighter">▲</button>
            <button class="btn-quad" onclick="sendCmd('floor_dimmer', 'Floor Dimmer')" title="Dimmer">▼</button>
            <button class="btn-quad" onclick="sendCmd('floor_warmer', 'Floor Warmer')">Warm</button>
            <button class="btn-quad" onclick="sendCmd('floor_cooler', 'Floor Cooler')">Cool</button>
          </div>
        </div>
      </div>
      <div class="drawer" id="floorDrawer">
        <div class="drawer-inner">
          <div class="btn-grid grid-4">
            <button onclick="sendCmd('floor_brighter', 'Floor Brighter')">Brighter</button>
            <button onclick="sendCmd('floor_dimmer', 'Floor Dimmer')">Dimmer</button>
            <button onclick="sendCmd('floor_warmer', 'Floor Warmer')">Warmer</button>
            <button onclick="sendCmd('floor_cooler', 'Floor Cooler')">Cooler</button>
          </div>
          <div class="resync-bar">
            <span class="resync-label">Sync:</span>
            <button class="btn-pill" onclick="resync('floor', 1)">ON</button>
            <button class="btn-pill" onclick="resync('floor', 0)">OFF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 4: Desk Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Desk</div>
        <div class="header-right">
          <span class="status-badge" id="deskBadge">OFF</span>
          <button class="btn-expand" onclick="toggleDrawer('deskDrawer', this)" aria-label="Expand">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="btn-grid grid-2">
          <button class="btn-on" onclick="sendDeskCmd('ON', 'Desk ON')">ON</button>
          <button class="btn-off" onclick="sendDeskCmd('OFF', 'Desk OFF')">OFF</button>
        </div>
      </div>
      <div class="drawer" id="deskDrawer">
        <div class="drawer-inner">
          <button class="btn-wide" onclick="sendDeskCmd('TAP', 'Desk Cycle Color')">Cycle Color</button>
        </div>
      </div>
    </div>

    <!-- Card 5: Bedside Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Bedside</div>
        <div class="header-right">
          <span class="status-badge" id="bedsideBadge">OFF</span>
          <button class="btn-expand" onclick="toggleDrawer('bedsideDrawer', this)" aria-label="Expand">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="split-layout">
          <button class="btn-power-tall" onclick="sendCmd('bedside_power', 'Bedside Power')">Power</button>
          <div class="quad-grid">
            <button class="btn-quad" onclick="sendCmd('bedside_brighter', 'Bedside Brighter')" title="Brighter">▲</button>
            <button class="btn-quad" onclick="sendCmd('bedside_dimmer', 'Bedside Dimmer')" title="Dimmer">▼</button>
            <button class="btn-quad" onclick="sendCmd('bedside_warmer', 'Bedside Warmer')">Warm</button>
            <button class="btn-quad" onclick="sendCmd('bedside_cooler', 'Bedside Cooler')">Cool</button>
          </div>
        </div>
      </div>
      <div class="drawer" id="bedsideDrawer">
        <div class="drawer-inner">
          <div class="btn-grid grid-4">
            <button onclick="sendCmd('bedside_brighter', 'Bedside Brighter')">Brighter</button>
            <button onclick="sendCmd('bedside_dimmer', 'Bedside Dimmer')">Dimmer</button>
            <button onclick="sendCmd('bedside_warmer', 'Bedside Warmer')">Warmer</button>
            <button onclick="sendCmd('bedside_cooler', 'Bedside Cooler')">Cooler</button>
          </div>
          <div class="resync-bar">
            <span class="resync-label">Sync:</span>
            <button class="btn-pill" onclick="resync('bedside', 1)">ON</button>
            <button class="btn-pill" onclick="resync('bedside', 0)">OFF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 6: Donut Lamp -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Donut</div>
        <div class="header-right">
          <span class="status-badge" id="donutBadge">OFF</span>
        </div>
      </div>
      <div class="card-body">
        <div class="btn-grid grid-2">
          <button class="btn-on" onclick="sendCmd('donut_on', 'Donut ON')">ON</button>
          <button class="btn-off" onclick="sendCmd('donut_off', 'Donut OFF')">OFF</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">
        <span>HiveMQ Cloud Settings</span>
        <span style="cursor:pointer; font-size:1.2rem;" onclick="closeSettings()">&times;</span>
      </div>
      <div class="form-group">
        <label>Cluster Host</label>
        <input type="text" id="cfgHost" placeholder="e.g. xxxxxx.s1.eu.hivemq.cloud" />
      </div>
      <div class="form-group">
        <label>WebSockets Port</label>
        <input type="number" id="cfgPort" value="8884" />
      </div>
      <div class="form-group">
        <label>Path</label>
        <input type="text" id="cfgPath" value="/mqtt" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="cfgUser" placeholder="HiveMQ credentials username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="cfgPass" placeholder="HiveMQ credentials password" />
      </div>
      <div class="form-group">
        <label>Topic Prefix</label>
        <input type="text" id="cfgPrefix" value="home/universal_remote" />
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let client = null;
    let toastTimer = null;

    const defaultCfg = {
      host: '0a91464cd01b488489e6e5603cba4112.s1.eu.hivemq.cloud',
      port: 8884,
      path: '/mqtt',
      user: 'anmolp',
      pass: 'aplights',
      prefix: 'home/universal_remote'
    };

    function loadConfig() {
      const stored = localStorage.getItem('remote_mqtt_cfg');
      if (stored) {
        try { return Object.assign({}, defaultCfg, JSON.parse(stored)); } catch(e){}
      }
      return Object.assign({}, defaultCfg);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function haptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(20);
      }
    }

    function toggleDrawer(drawerId, btn) {
      haptic();
      const drawer = document.getElementById(drawerId);
      if (!drawer) return;
      const isOpen = drawer.classList.toggle('open');
      if (btn) {
        btn.classList.toggle('expanded', isOpen);
      }
    }

    function updateBadge(id, isOn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = isOn ? 'ON' : 'OFF';
      el.className = 'status-badge ' + (isOn ? 'on' : 'off');
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('cloudBadge');
      const label = document.getElementById('cloudStatusText');
      badge.className = 'cloud-badge ' + status;
      label.textContent = text;
    }

    function openSettings() {
      const cfg = loadConfig();
      document.getElementById('cfgHost').value = cfg.host;
      document.getElementById('cfgPort').value = cfg.port;
      document.getElementById('cfgPath').value = cfg.path;
      document.getElementById('cfgUser').value = cfg.user;
      document.getElementById('cfgPass').value = cfg.pass;
      document.getElementById('cfgPrefix').value = cfg.prefix;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const cfg = {
        host: document.getElementById('cfgHost').value.trim(),
        port: parseInt(document.getElementById('cfgPort').value.trim()) || 8884,
        path: document.getElementById('cfgPath').value.trim(),
        user: document.getElementById('cfgUser').value.trim(),
        pass: document.getElementById('cfgPass').value.trim(),
        prefix: document.getElementById('cfgPrefix').value.trim()
      };
      localStorage.setItem('remote_mqtt_cfg', JSON.stringify(cfg));
      closeSettings();
      initMqtt();
    }

    function initMqtt() {
      const cfg = loadConfig();
      if (client) {
        try { client.end(true); } catch(e){}
      }

      setConnectionStatus('connecting', 'Connecting...');

      const brokerUrl = `wss://${cfg.host}:${cfg.port}${cfg.path}`;
      console.log('[MQTT] Connecting to:', brokerUrl);

      try {
        client = mqtt.connect(brokerUrl, {
          clientId: 'portal-' + Math.random().toString(16).substr(2, 8),
          username: cfg.user,
          password: cfg.pass,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 4000
        });

        client.on('connect', () => {
          console.log('[MQTT] Connected to cloud broker');
          setConnectionStatus('online', 'Connected');

          const statusTopic = `${cfg.prefix}/status`;
          const availTopic = `${cfg.prefix}/availability`;
          const deskStatusTopic = 'home/desk_lamp/status';
          const deskAvailTopic = 'home/desk_lamp/availability';

          client.subscribe([statusTopic, availTopic, deskStatusTopic, deskAvailTopic], (err) => {
            if (!err) console.log('Subscribed to status topics');
          });
        });

        client.on('message', (topic, payload) => {
          const str = payload.toString();
          console.log('[MQTT RX]', topic, str);

          if (topic === 'home/desk_lamp/status') {
            try {
              const data = JSON.parse(str);
              updateBadge('deskBadge', data.state === 'ON');
            } catch(e) {
              updateBadge('deskBadge', str.toUpperCase() === 'ON');
            }
          } else if (topic.endsWith('/status')) {
            try {
              const data = JSON.parse(str);
              updateBadge('posterBadge', data.poster);
              updateBadge('donutBadge', data.donut);
              updateBadge('bedsideBadge', data.bedside);
              const floorVal = data.floor !== undefined ? data.floor : data.overhead;
              updateBadge('floorBadge', floorVal);
              if (data.desk !== undefined) {
                updateBadge('deskBadge', data.desk);
              }

              const hubState = document.getElementById('hubState');
              if (hubState) {
                hubState.textContent = data.busy ? 'Busy' : 'Ready';
                hubState.className = 'status-badge ' + (data.busy ? 'on' : '');
              }
            } catch(e){}
          } else if (topic.endsWith('/availability')) {
            if (str === 'offline') {
              showToast('Device went offline');
            }
          }
        });

        client.on('error', (err) => {
          console.error('[MQTT Error]', err);
          setConnectionStatus('offline', 'Error');
        });

        client.on('close', () => {
          setConnectionStatus('offline', 'Disconnected');
        });

        client.on('reconnect', () => {
          setConnectionStatus('connecting', 'Connecting...');
        });

      } catch (err) {
        console.error('Failed to init MQTT:', err);
        setConnectionStatus('offline', 'Failed');
      }
    }

    function sendCmd(action, label) {
      haptic();
      showToast(label || action);

      const cfg = loadConfig();
      if (!client || !client.connected) {
        showToast('Not connected to cloud');
        return;
      }

      const cmdTopic = `${cfg.prefix}/command`;
      client.publish(cmdTopic, action, { qos: 0 });
    }

    function sendDeskCmd(action, label) {
      haptic();
      showToast(label || action);

      if (client && client.connected) {
        client.publish('home/desk_lamp/command', action, { qos: 0 });
      } else {
        fetch('http://desk-lamp.local/api/lamp/' + action.toLowerCase(), { mode: 'no-cors' })
          .catch(() => {});
      }
    }

    function resync(device, state) {
      haptic();
      const stateStr = state ? 'on' : 'off';
      showToast(`Sync ${device} -> ${stateStr.toUpperCase()}`);
      sendCmd(`sync_${device}_${stateStr}`, `Sync ${device} ${stateStr.toUpperCase()}`);
    }

    // Auto action from URL parameter for Apple Shortcuts / Siri triggers
    function checkUrlAction() {
      const params = new URLSearchParams(window.location.search);
      const action = params.get('action');
      if (action) {
        console.log('[Auto Action] Triggering:', action);
        showToast(`Triggering: ${action}`);
        const tryDispatch = () => {
          if (client && client.connected) {
            sendCmd(action, `Auto: ${action}`);
          } else {
            setTimeout(tryDispatch, 200);
          }
        };
        tryDispatch();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMqtt();
      checkUrlAction();
    });
  </script>
</body>
</html>
