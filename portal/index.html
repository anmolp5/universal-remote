<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Universal Remote</title>
  <!-- MQTT.js for browser WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #171d2b 0%, #0a0d14 100%);
      --card-bg: rgba(22, 27, 39, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.28);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --btn-bg: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.12);
      --status-on: #10b981;
      --status-off: #475569;
      --status-warn: #f59e0b;
      --status-err: #ef4444;
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-color: #0a0d14;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px 24px;
    }

    header {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 2px 4px;
    }

    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .title-group p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cloud-badge.online {
      color: var(--status-on);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }

    .cloud-badge.connecting {
      color: var(--status-warn);
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.1);
    }

    .cloud-badge.offline {
      color: var(--status-err);
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .cloud-badge.online .pulse-dot {
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-blue);
    }

    /* Main Grid Layout */
    main {
      width: 100%;
      max-width: 580px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      align-items: start;
    }

    .card-full-width {
      grid-column: span 2;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, min-height 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 135px;
    }

    .card.card-banner {
      min-height: auto;
      padding: 10px 14px;
    }

    .card.card-floor {
      min-height: auto;
      padding: 10px 14px;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-badge.on {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.off {
      background: rgba(255, 255, 255, 0.04);
      color: #64748b;
      border-color: rgba(255, 255, 255, 0.06);
    }

    .btn-expand {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-expand:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-blue);
    }

    .btn-expand svg {
      transition: transform 0.25s ease;
    }

    .btn-expand.expanded svg {
      transform: rotate(180deg);
      stroke: var(--accent-blue);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
      justify-content: center;
    }

    /* Buttons Base */
    button {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(1.2);
    }

    /* Banner Pill Buttons for All Lights */
    .banner-pill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1px;
    }

    .btn-pill-wide {
      padding: 10px 16px;
      min-height: 42px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .btn-master-on {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.25) 100%);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .btn-master-off {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(185, 28, 28, 0.2) 100%);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* Floor Lamp Full-Width Controls Row */
    .floor-controls-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      align-items: center;
    }

    .floor-controls-row .btn-quad {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: 54px;
      padding: 0;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 10px;
    }

    /* Square Buttons Grid for 2-button cards (Poster, Desk, Donut) */
    .btn-square-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex: 1;
      padding: 2px 0;
    }

    .btn-square {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 68px;
      max-height: 68px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 12px;
    }

    .btn-on {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .btn-off {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Bedside Morphing Card */
    .bedside-layout {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 6px;
      flex: 1;
      align-items: center;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-bedside-power {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: 68px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      border-radius: 10px;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bedside-quad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-quad {
      padding: 0;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: 32px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 8px;
    }

    /* Bedside Expanded State Morph */
    #bedsideCard.expanded-morph .bedside-layout {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #bedsideCard.expanded-morph .btn-bedside-power {
      width: 100%;
      min-height: 38px;
      max-height: 38px;
      height: 38px;
      aspect-ratio: unset;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    #bedsideCard.expanded-morph .bedside-quad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 144px;
      margin: 0 auto;
    }

    #bedsideCard.expanded-morph .bedside-quad .btn-quad {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 68px;
      max-height: 68px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
    }

    /* Inline Drawer Accordion */
    .drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.open {
      grid-template-rows: 1fr;
    }

    .drawer-inner {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer.open .drawer-inner {
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 8px;
    }

    .btn-wide {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 10px;
    }

    .resync-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 4px;
    }

    .resync-label {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .btn-pill {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .cct-presets-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }

    .btn-cct {
      flex: 1;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 6px 4px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-cct:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .btn-cct:active {
      transform: scale(0.96);
    }

    .btn-cct-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .rgb-slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
      width: 100%;
    }

    .rgb-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
    }

    .rgb-label {
      font-weight: 700;
      width: 14px;
      font-family: monospace;
    }

    .rgb-r { color: #ff5555; }
    .rgb-g { color: #55ff77; }
    .rgb-b { color: #5599ff; }

    .rgb-slider {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .rgb-slider-red { accent-color: #ff4444; }
    .rgb-slider-green { accent-color: #22c55e; }
    .rgb-slider-blue { accent-color: #3b82f6; }

    .rgb-val {
      font-size: 0.68rem;
      font-family: monospace;
      color: var(--text-muted);
      width: 28px;
      text-align: right;
    }

    .rgb-preview-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      padding-top: 4px;
    }

    .rgb-preview-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .rgb-preview-hex {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .color-palette-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .btn-color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn-color-dot:active {
      transform: scale(0.85);
    }

    .btn-color-picker-label {
      display: inline-flex;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      cursor: pointer;
    }

    .brightness-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
    }

    /* Modal Backdrop & Card */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b27;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 22px;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .btn-save {
      background: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      color: #041019;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(22, 27, 39, 0.95);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      pointer-events: none;
      z-index: 200;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Universal Remote</h1>
      <p>Smart Lighting Hub</p>
    </div>
    <div class="header-actions">
      <div class="cloud-badge offline" id="cloudBadge" onclick="openSettings()">
        <span class="pulse-dot"></span>
        <span id="cloudStatusText">Offline</span>
      </div>
      <button class="btn-settings" onclick="openSettings()" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Card 1: All Lights (Full-Width Banner) -->
    <div class="card card-full-width card-banner">
      <div class="card-header">
        <div class="card-title">All Lights</div>
        <div class="header-right">
          <span class="status-badge" id="hubState">Ready</span>
        </div>
      </div>
      <div class="card-body">
        <div class="banner-pill-grid">
          <button class="btn-pill-wide btn-master-on" onclick="sendCmd('all_on', 'ALL ON')">ALL ON</button>
          <button class="btn-pill-wide btn-master-off" onclick="sendCmd('all_off', 'ALL OFF')">ALL OFF</button>
        </div>
      </div>
    </div>

    <!-- Card 2: Floor Lamp (Full-Width Card) -->
    <div class="card card-full-width card-floor">
      <div class="card-header">
        <div class="card-title">Floor</div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">

        <label>Cluster Host</label>
        <input type="text" id="cfgHost" placeholder="e.g. xxxxxx.s1.eu.hivemq.cloud" />
      </div>
      <div class="form-group">
        <label>WebSockets Port</label>
        <input type="number" id="cfgPort" value="8884" />
      </div>
      <div class="form-group">
        <label>Path</label>
        <input type="text" id="cfgPath" value="/mqtt" />
      </div>

        <label>Username</label>
        <input type="text" id="cfgUser" placeholder="HiveMQ credentials username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="cfgPass" placeholder="HiveMQ credentials password" />
      </div>
      <div class="form-group">
        <label>Topic Prefix</label>
        <input type="text" id="cfgPrefix" value="home/universal_remote" />
      </div>
      <div class="form-group" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--card-border);">
        <label style="font-weight:700; color:#38bdf8;">Bluetooth Low Energy (BLE)</label>
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:8px;">Disconnect ESP32 so Lotus Lamp or Donut phone apps can connect:</p>
        <div style="display:flex; gap:8px;">
          <button class="btn-cancel" style="flex:1;" type="button" onclick="releaseBle()">Release BLE</button>
          <button class="btn-save" style="flex:1;" type="button" onclick="reconnectBle()">Reconnect BLE</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let client = null;
    let toastTimer = null;

    const defaultCfg = {
      host: '0a91464cd01b488489e6e5603cba4112.s1.eu.hivemq.cloud',
      port: 8884,
      path: '/mqtt',
      user: 'anmolp',
      pass: 'aplights',
      prefix: 'home/universal_remote'
    };

    function loadConfig() {
      const stored = localStorage.getItem('remote_mqtt_cfg');
      if (stored) {
        try { return Object.assign({}, defaultCfg, JSON.parse(stored)); } catch(e){}
      }
      return Object.assign({}, defaultCfg);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function haptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(20);
      }
    }

    function toggleDrawer(drawerId, btn) {
      haptic();
      const drawer = document.getElementById(drawerId);
      if (!drawer) return;
      const isOpen = drawer.classList.toggle('open');
      if (btn) {
        btn.classList.toggle('expanded', isOpen);
      }
    }

    function toggleBedsideMorph(btn) {
      haptic();
      const card = document.getElementById('bedsideCard');
      const drawer = document.getElementById('bedsideDrawer');
      if (!card) return;
      const isExpanded = card.classList.toggle('expanded-morph');
      if (drawer) drawer.classList.toggle('open', isExpanded);
      if (btn) btn.classList.toggle('expanded', isExpanded);
    }

    function updateBadge(id, isOn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = isOn ? 'ON' : 'OFF';
      el.className = 'status-badge ' + (isOn ? 'on' : 'off');
    }

    function setConnectionStatus(status, text) {
      const badge = document.getElementById('cloudBadge');
      const label = document.getElementById('cloudStatusText');
      badge.className = 'cloud-badge ' + status;
      label.textContent = text;
    }

    function openSettings() {
      const cfg = loadConfig();
      document.getElementById('cfgHost').value = cfg.host;
      document.getElementById('cfgPort').value = cfg.port;
      document.getElementById('cfgPath').value = cfg.path;
      document.getElementById('cfgUser').value = cfg.user;
      document.getElementById('cfgPass').value = cfg.pass;
      document.getElementById('cfgPrefix').value = cfg.prefix;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const cfg = {
        host: document.getElementById('cfgHost').value.trim(),
        port: parseInt(document.getElementById('cfgPort').value.trim()) || 8884,
        path: document.getElementById('cfgPath').value.trim(),
        user: document.getElementById('cfgUser').value.trim(),
        pass: document.getElementById('cfgPass').value.trim(),
        prefix: document.getElementById('cfgPrefix').value.trim()
      };
      localStorage.setItem('remote_mqtt_cfg', JSON.stringify(cfg));
      closeSettings();
      initMqtt();
    }

    function initMqtt() {
      const cfg = loadConfig();
      if (client) {
        try { client.end(true); } catch(e){}
      }

      setConnectionStatus('connecting', 'Connecting...');

      const brokerUrl = `wss://${cfg.host}:${cfg.port}${cfg.path}`;
      console.log('[MQTT] Connecting to:', brokerUrl);

      try {
        client = mqtt.connect(brokerUrl, {
          clientId: 'portal-' + Math.random().toString(16).substr(2, 8),
          username: cfg.user,
          password: cfg.pass,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 4000
        });

        client.on('connect', () => {
          console.log('[MQTT] Connected to cloud broker');
          setConnectionStatus('online', 'Connected');

          const statusTopic = `${cfg.prefix}/status`;
          const availTopic = `${cfg.prefix}/availability`;
          const deskStatusTopic = 'home/desk_lamp/status';
          const deskAvailTopic = 'home/desk_lamp/availability';

          client.subscribe([statusTopic, availTopic, deskStatusTopic, deskAvailTopic], (err) => {
            if (!err) console.log('Subscribed to status topics');
          });
        });

        client.on('message', (topic, payload) => {
          const str = payload.toString();
          console.log('[MQTT RX]', topic, str);

          if (topic === 'home/desk_lamp/status') {
            try {
              const data = JSON.parse(str);
              updateBadge('deskBadge', data.state === 'ON');
            } catch(e) {
              updateBadge('deskBadge', str.toUpperCase() === 'ON');
            }
          } else if (topic.endsWith('/status')) {
            try {
              const data = JSON.parse(str);
              updateStatesFromJson(data);
            } catch(e){}
          } else if (topic.endsWith('/availability')) {
            if (str === 'offline') {
              showToast('Device went offline');
            }
          }
        });

        client.on('error', (err) => {
          console.error('[MQTT Error]', err);
          setConnectionStatus('offline', 'Error');
        });

        client.on('close', () => {
          setConnectionStatus('offline', 'Disconnected');
        });

        client.on('reconnect', () => {
          setConnectionStatus('connecting', 'Connecting...');
        });

      } catch (err) {
        console.error('Failed to init MQTT:', err);
        setConnectionStatus('offline', 'Failed');
      }
    }

    function updateStatesFromJson(data) {
      if (!data) return;
      let cached = {};
      try {
        cached = JSON.parse(localStorage.getItem('cached_device_states') || '{}');
      } catch(e) {}
      const merged = { ...cached, ...data };
      try {
        localStorage.setItem('cached_device_states', JSON.stringify(merged));
      } catch(e) {}

      if (merged.poster !== undefined) updateBadge('posterBadge', merged.poster);
      if (merged.donut !== undefined) updateBadge('donutBadge', merged.donut);
      if (merged.bedside !== undefined) updateBadge('bedsideBadge', merged.bedside);
      const floorVal = merged.floor !== undefined ? merged.floor : merged.overhead;
      if (floorVal !== undefined) updateBadge('floorBadge', floorVal);
      if (merged.desk !== undefined) updateBadge('deskBadge', merged.desk);
      const hubState = document.getElementById('hubState');
      if (hubState && merged.busy !== undefined) {
        hubState.textContent = merged.busy ? 'Busy' : 'Ready';
        hubState.className = 'status-badge ' + (merged.busy ? 'on' : '');
      }
    }

    function sendCmd(action, label) {
      haptic();
      showToast(label || action);

      const cfg = loadConfig();
      if (client && client.connected) {
        const cmdTopic = `${cfg.prefix}/command`;
        client.publish(cmdTopic, action, { qos: 0 });
      } else {
        fetch('/api/action?cmd=' + encodeURIComponent(action))
          .then(r => r.json())
          .then(d => {
            if (d.states) updateStatesFromJson(d.states);
          })
          .catch(() => {});
      }
    }

    function sendFloorCCT(warm, cool, label) {
      haptic();
      showToast(label || 'Floor White Mode');
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, `FLOOR_CCT:${warm},${cool}`);
      } else {
        fetch(`/api/floor/cct?warm=${warm}&cool=${cool}`, { method: 'POST' }).catch(()=>{});
      }
    }

    function sendFloorColor(r, g, b, label) {
      haptic();
      showToast(label || 'Floor Color');
      const hex = ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, `FLOOR_COLOR:#${hex}`);
      } else {
        fetch(`/api/floor/color?r=${r}&g=${g}&b=${b}`, { method: 'POST' }).catch(()=>{});
      }
    }

    function pickFloorColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      sendFloorColor(r, g, b, 'Custom Color');
    }

    let donutRgbDebounce = null;
    function onDonutRgbInput() {
      const r = parseInt(document.getElementById('donutR').value);
      const g = parseInt(document.getElementById('donutG').value);
      const b = parseInt(document.getElementById('donutB').value);
      document.getElementById('donutRVal').textContent = r;
      document.getElementById('donutGVal').textContent = g;
      document.getElementById('donutBVal').textContent = b;
      const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
      document.getElementById('donutPreviewDot').style.background = `rgb(${r},${g},${b})`;
      document.getElementById('donutPreviewHex').textContent = hex;

      if (!donutRgbDebounce) {
        donutRgbDebounce = setTimeout(() => {
          donutRgbDebounce = null;
          sendDonutColor(r, g, b, 'Donut RGB', false);
        }, 100);
      }
    }

    function onDonutRgbChange() {
      const r = parseInt(document.getElementById('donutR').value);
      const g = parseInt(document.getElementById('donutG').value);
      const b = parseInt(document.getElementById('donutB').value);
      sendDonutColor(r, g, b, 'Donut RGB', true);
    }

    function applyDonutRgb() {
      onDonutRgbChange();
    }

    function syncDonutSliders(r, g, b) {
      const rEl = document.getElementById('donutR');
      const gEl = document.getElementById('donutG');
      const bEl = document.getElementById('donutB');
      if (rEl && gEl && bEl) {
        rEl.value = r;
        gEl.value = g;
        bEl.value = b;
        document.getElementById('donutRVal').textContent = r;
        document.getElementById('donutGVal').textContent = g;
        document.getElementById('donutBVal').textContent = b;
        const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        document.getElementById('donutPreviewDot').style.background = `rgb(${r},${g},${b})`;
        document.getElementById('donutPreviewHex').textContent = hex;
      }
    }

    function sendDonutColor(r, g, b, label, showToastMsg = true) {
      if (showToastMsg) {
        haptic();
        showToast(label || 'Donut Color');
      }
      syncDonutSliders(r, g, b);
      const hex = ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, `DONUT_COLOR:#${hex}`);
      } else {
        fetch(`/api/donut/color?r=${r}&g=${g}&b=${b}`, { method: 'POST' }).catch(()=>{});
      }
    }

    function sendDonutBri(val) {
      haptic();
      showToast(`Donut ${val}%`);
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, `DONUT_BRIGHTNESS:${val}`);
      } else {
        fetch(`/api/donut/brightness?value=${val}`, { method: 'POST' }).catch(()=>{});
      }
    }

    function releaseBle() {
      haptic();
      showToast('BLE Released');
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, 'BLE_RELEASE');
      } else {
        fetch('/api/ble/release', { method: 'POST' }).catch(()=>{});
      }
    }

    function reconnectBle() {
      haptic();
      showToast('BLE Reconnecting');
      const cfg = loadConfig();
      if (client && client.connected) {
        client.publish(`${cfg.prefix}/command`, 'BLE_RECONNECT');
      } else {
        fetch('/api/ble/reconnect', { method: 'POST' }).catch(()=>{});
      }
    }

    function sendDeskCmd(action, label) {
      haptic();
      showToast(label || action);

      if (client && client.connected) {
        client.publish('home/desk_lamp/command', action, { qos: 0 });
      } else {
        fetch('http://desk-lamp.local/api/lamp/' + action.toLowerCase(), { mode: 'no-cors' })
          .catch(() => {});
      }
    }

    function resync(device, state) {
      haptic();
      const stateStr = state ? 'on' : 'off';
      showToast(`Sync ${device} -> ${stateStr.toUpperCase()}`);
      sendCmd(`sync_${device}_${stateStr}`, `Sync ${device} ${stateStr.toUpperCase()}`);
    }

    // Auto action from URL parameter for Apple Shortcuts / Siri triggers
    function checkUrlAction() {
      const params = new URLSearchParams(window.location.search);
      const action = params.get('action');
      if (action) {
        console.log('[Auto Action] Triggering:', action);
        showToast(`Triggering: ${action}`);
        const tryDispatch = () => {
          if (client && client.connected) {
            sendCmd(action, `Auto: ${action}`);
          } else {
            setTimeout(tryDispatch, 200);
          }
        };
        tryDispatch();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const cached = JSON.parse(localStorage.getItem('cached_device_states') || '{}');
        if (Object.keys(cached).length > 0) {
          updateStatesFromJson(cached);
        }
      } catch(e) {}
      fetch('/api/status').then(r => r.json()).then(updateStatesFromJson).catch(()=>{});
      initMqtt();
      checkUrlAction();
    });
  </script>
</body>
</html>
